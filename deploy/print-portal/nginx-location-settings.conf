# Apply inside the existing print API proxy location, preserving its upstream,
# headers, authentication, WAF and rate-limit rules. This is not a server block.
client_max_body_size 68m;
client_body_buffer_size 68m;
proxy_http_version 1.1;
proxy_request_buffering off;
# Converted PDFs must not spill into proxy response temp files.
proxy_buffering off;
proxy_max_temp_file_size 0;
proxy_read_timeout 600s;
proxy_send_timeout 600s;
